name: lint

on:
  push:
    branches: [main]
    paths-ignore: ['reports/**']
  pull_request:
    paths-ignore: ['reports/**']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/lint.sh
